  <circle cx="950" cy="300" r="130" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-opacity="0.6"/>
  <circle cx="950" cy="300" r="110" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 6"/>
  <rect x="885" y="235" width="130" height="130" rx="28" transform="rotate(45 950 300)" fill="url(#gold)"/>
  <polygon points="950,250 964,286 1000,300 964,314 950,350 936,314 900,300 936,286" fill="#18181b"/>
