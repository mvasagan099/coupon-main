  <path d="M0 450 Q450 320 850 480 T1200 360" fill="none" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.25"/>
  <rect x="885" y="235" width="130" height="130" rx="30" fill="url(#metal)"/>
  <circle cx="950" cy="300" r="36" fill="#0f172a"/>
